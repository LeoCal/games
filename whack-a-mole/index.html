<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!-- Firebase SDK for global leaderboard -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="app.js" defer></script>
    <title>Whack a Mole</title>
    <meta name="description" content="Classic Whack a Mole arcade game with scoring, timer, and global leaderboard." />
    <meta property="og:title" content="Whack a Mole" />
    <meta property="og:description" content="Classic Whack a Mole arcade game with scoring, timer, and global leaderboard." />
    <!-- Google AdSense Account Verification Meta Tag -->
    <meta name="google-adsense-account" content="ca-pub-5034717836472110" />
    <!-- Google AdSense SDK -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5034717836472110" crossorigin="anonymous"></script>
  </head>
  <body>
    <!-- Language Quick Selector at the top -->
    <div class="lang-selector-container" id="langSelector">
      <button class="lang-btn" data-lang="EN" title="English">🇬🇧 EN</button>
      <button class="lang-btn active" data-lang="IT" title="Italiano">🇮🇹 IT</button>
      <button class="lang-btn" data-lang="FR" title="Français">🇫🇷 FR</button>
      <button class="lang-btn" data-lang="DE" title="Deutsch">🇩🇪 DE</button>
    </div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
      <h1 class="game-title">Whack a Mole</h1>
      <button class="start-btn" id="startBtn">Gioca</button>
      <button class="leaderboard-btn" id="leaderboardBtn">Classifica</button>
    </div>

    <!-- Leaderboard Screen (hidden initially) -->
    <div class="leaderboard-screen hidden" id="leaderboardScreen">
      <h1 class="game-title">Whack a Mole</h1>
      <div id="leaderboardContainer"></div>
      <button class="back-btn" id="backBtn">Indietro</button>
    </div>

    <!-- Game Screen (hidden initially) -->
    <div class="game-screen" id="gameScreen" style="display: none;">
      <!-- Level Up Banner Notification (hidden by default) -->
      <div class="level-up-toast hidden" id="levelUpToast">
        <div class="level-up-banner">
          <span class="level-up-icon">⚡</span>
          <span class="level-up-title" id="levelUpTitle">LEVEL UP!</span>
        </div>
        <div class="level-up-details">
          <span class="level-up-sub" id="levelUpSub">Livello 2 • Velocità 1.2x!</span>
          <span class="level-up-bonus" id="levelUpBonus">+4s Bonus Tempo! ⏱️</span>
        </div>
      </div>

      <div class="box">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label stat-score-label">Punti</span>
            <span class="stat-value score"><span>0</span></span>
          </div>
          <div class="stat-card stat-level">
            <span class="stat-label stat-level-label">Livello</span>
            <span class="stat-value level-display">1</span>
          </div>
          <div class="stat-card">
            <span class="stat-label stat-time-label">Tempo</span>
            <span class="stat-value countdown"><span>30</span>s</span>
          </div>
        </div>
        <!-- Progress toward next level -->
        <div class="level-progress-wrapper" title="Progresso per il prossimo livello">
          <div class="level-progress-track">
            <div class="level-progress-fill" id="levelProgressFill" style="width: 0%;"></div>
          </div>
          <span class="level-progress-text" id="levelProgressText">0/5 talpe al Livello 2</span>
        </div>
        <button class="pauseBtn">Pausa</button>
      </div>
      <div class="board">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
      </div>
      <div class="cursor"></div>
      <div class="finalScore"></div>
      <button class="restartBtn">Restart</button>
    </div>
  </body>
</html>
